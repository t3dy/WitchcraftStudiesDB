<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trials Database — WitchcraftStudiesDB</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { margin:0; background:#0d0d0d; color:#e8e0d0; font-family:Georgia,serif; }
.page-header { background:#111; border-bottom:1px solid #3a3a3a; padding:1.5rem 2rem 1rem; }
.page-header h1 { color:#C9A84C; font-family:'Palatino Linotype',Palatino,serif; font-size:2rem; margin:0 0 0.25rem; }
.page-header p { color:#888; font-size:0.9rem; margin:0; }
.controls { background:#1a1a1a; border-bottom:1px solid #3a3a3a; padding:0.75rem 2rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; }
.controls input, .controls select { background:#111; color:#e8e0d0; border:1px solid #3a3a3a; padding:0.4rem 0.65rem; border-radius:3px; font-family:Georgia,serif; font-size:0.85rem; }
.controls input[type=text] { flex:1; min-width:220px; }
#count { padding:0.4rem 2rem; color:#555; font-size:0.82rem; background:#0d0d0d; border-bottom:1px solid #1a1a1a; }
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; padding:1.5rem 2rem 3rem; max-width:1400px; margin:0 auto; }
.trial-card { background:#1f1f1f; border:1px solid #2a2a2a; border-radius:4px; padding:1.25rem; cursor:pointer; transition:border-color 0.15s,background 0.15s; }
.trial-card:hover { border-color:#C9A84C; background:#242424; }
.trial-card.HIGH { border-left:3px solid #8B0000; }
.trial-card.MEDIUM { border-left:3px solid #5a5a00; }
.trial-card.LOW { border-left:3px solid #2a2a2a; }
.trial-card h3 { color:#C9A84C; font-family:'Palatino Linotype',Palatino,serif; font-size:1rem; margin:0 0 0.35rem; line-height:1.3; }
.trial-meta { color:#888; font-size:0.78rem; margin-bottom:0.5rem; }
.trial-stats { display:flex; gap:0.5rem; margin:0.4rem 0; flex-wrap:wrap; }
.stat-pill { background:#1a0000; border:1px solid #5a1111; border-radius:3px; padding:0.1rem 0.5rem; font-size:0.72rem; color:#e8e0d0; }
.stat-pill.accused-pill { background:#1a1a00; border-color:#5a5a11; }
.trial-summary { display:none; margin-top:0.75rem; border-top:1px solid #2a2a2a; padding-top:0.75rem; }
.trial-summary.open { display:block; }
.trial-summary p { color:#b8b0a0; font-size:0.83rem; line-height:1.6; margin:0 0 0.5rem; }
.trial-summary .hist-note { color:#666; font-size:0.78rem; font-style:italic; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid #222; }
.region-tag { display:inline-block; background:#1a1a1a; border:1px solid #3a3a3a; border-radius:3px; padding:0.1rem 0.4rem; font-size:0.7rem; color:#888; margin-top:0.3rem; }
.toggle-hint { font-size:0.72rem; color:#555; margin-top:0.4rem; }
.sort-bar { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
.sort-bar label { color:#888; font-size:0.8rem; }
</style>
</head>
<body>
<nav style="background:#1a1a1a;border-bottom:2px solid #8B0000;padding:0.75rem 2rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap;position:sticky;top:0;z-index:100;">
  <a href="index.html" style="color:#C9A84C;font-size:1.1rem;font-weight:bold;text-decoration:none;font-family:'Palatino Linotype',Palatino,serif;">⚸ WitchcraftStudiesDB</a>
  <a href="map.html" style="color:#e8e0d0;text-decoration:none;">Map</a>
  <a href="timeline.html" style="color:#e8e0d0;text-decoration:none;">Timeline</a>
  <a href="trials.html" style="color:#C9A84C;text-decoration:none;border-bottom:1px solid #C9A84C;">Trials</a>
  <a href="concepts.html" style="color:#e8e0d0;text-decoration:none;">Concepts</a>
  <a href="scholars.html" style="color:#e8e0d0;text-decoration:none;">Scholars</a>
  <a href="accused.html" style="color:#e8e0d0;text-decoration:none;">People</a>
  <a href="about.html" style="color:#e8e0d0;text-decoration:none;">About</a>
  <a href="devils-bride.html" style="color:#e8e0d0;text-decoration:none;">Essays</a>
</nav>
<div class="page-header">
  <h1>⚖ Trial Database</h1>
  <p>Major European witch trial events with execution counts, regional context, and historiographical analysis. Click any card for details.</p>
</div>
<div class="controls">
  <input type="text" id="search" placeholder="Search trials by name, location, or summary...">
  <select id="regionFilter">
    <option value="">All Regions</option>
    <option value="Scotland">Scotland</option>
    <option value="England">England</option>
    <option value="Germany">Germany</option>
    <option value="France">France</option>
    <option value="Italy">Italy</option>
    <option value="Switzerland">Switzerland</option>
    <option value="Spain">Spain</option>
    <option value="Scandinavia">Scandinavia</option>
    <option value="Americas">Americas</option>
  </select>
  <div class="sort-bar">
    <label>Sort:</label>
    <select id="sortBy">
      <option value="year">Chronological</option>
      <option value="executions">By Executions (most first)</option>
      <option value="accused">By Accused Count</option>
      <option value="name">Alphabetical</option>
    </select>
  </div>
</div>
<div id="count"></div>
<div id="grid"></div>

<script src="js/data_bundle.js"></script>
<script>
const grid = document.getElementById('grid');
const locMap = {};
(window.LOCATIONS || []).forEach(l => { locMap[l.id] = l; });

function getRegionDisplay(trial) {
  const loc = locMap[trial.location_id];
  if (loc) return loc.region || '';
  return trial.region || '';
}

function regionMatches(trial, filterVal) {
  if (!filterVal) return true;
  const r = getRegionDisplay(trial) + ' ' + (trial.region || '');
  return r.toLowerCase().includes(filterVal.toLowerCase());
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const regionFilter = document.getElementById('regionFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let trials = (window.TRIALS || []).filter(t => {
    if (q) {
      const searchable = (t.name + ' ' + (t.summary || '') + ' ' + (t.location_id || '') + ' ' + getRegionDisplay(t)).toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    if (!regionMatches(t, regionFilter)) return false;
    return true;
  }).sort((a, b) => {
    if (sortBy === 'executions') return (b.executed_count || 0) - (a.executed_count || 0);
    if (sortBy === 'accused') return (b.alleged_accused_count || 0) - (a.alleged_accused_count || 0);
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    return a.year_start - b.year_start;
  });

  document.getElementById('count').textContent = trials.length + ' trials';
  grid.innerHTML = '';

  trials.forEach(t => {
    const region = getRegionDisplay(t);
    const loc = locMap[t.location_id];
    const locationName = loc ? loc.name : t.location_id;
    const yearRange = t.year_start + (t.year_end && t.year_end !== t.year_start ? '–' + t.year_end : '');

    const card = document.createElement('div');
    card.className = 'trial-card ' + (t.confidence || 'MEDIUM');

    card.innerHTML = `
      <h3>${t.name}</h3>
      <div class="trial-meta">${locationName || ''} · ${yearRange}</div>
      ${region ? `<span class="region-tag">${region}</span>` : ''}
      <div class="trial-stats">
        <span class="stat-pill">⚰ ${t.executed_count !== null ? t.executed_count : '?'} executed</span>
        <span class="stat-pill accused-pill">👤 ${t.alleged_accused_count !== null ? t.alleged_accused_count : '?'} accused</span>
      </div>
      <div class="toggle-hint" style="color:#555;font-size:0.72rem;">▶ Click for details</div>
      <div class="trial-summary">
        <p>${t.summary || ''}</p>
        ${t.historiographical_significance ? `<p class="hist-note">${t.historiographical_significance}</p>` : ''}
        ${t.scholarly_disagreement ? `<p style="color:#666;font-size:0.78em;margin-top:0.4rem;font-style:italic;">Scholarly debate: ${t.scholarly_disagreement}</p>` : ''}
      </div>`;

    card.addEventListener('click', () => {
      const detail = card.querySelector('.trial-summary');
      const hint = card.querySelector('.toggle-hint');
      detail.classList.toggle('open');
      hint.textContent = detail.classList.contains('open') ? '▼ Click to collapse' : '▶ Click for details';
    });
    grid.appendChild(card);
  });

  if (trials.length === 0) {
    grid.innerHTML = '<p style="color:#555;text-align:center;padding:3rem;font-style:italic;grid-column:1/-1;">No trials match current filters.</p>';
  }
}

['search', 'regionFilter', 'sortBy'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});
render();
</script>
</body>
</html>
